version: '3.8'

services:
  backend:
    build: .
    command: python -m uvicorn app.main:app_asgi --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - kafka
      - celery_worker
      - celery_beat
    env_file:
      - .env

  celery_worker:
    build: .
    command: python -m celery -A app.tasks worker --loglevel=info --autoscale=10,2
    depends_on:
      - redis
      - postgres
    env_file:
      - .env

  celery_beat:
    build: .
    command: python -m celery -A app.tasks beat --loglevel=info
    depends_on:
      - redis
      - postgres
    env_file:
      - .env

  postgres:
    image: postgis/postgis:13-3.4
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: logistics
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6
    ports:
      - "6379:6379"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro  # If you have static files
    depends_on:
      - backend

  celery_autoscaler:
    build: .
    command: python app/services/celery_autoscaler.py
    depends_on:
      - redis
      - postgres
      - celery_worker
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MIN_WORKERS=2
      - MAX_WORKERS=10
      - SCALE_UP_THRESHOLD=100
      - SCALE_DOWN_THRESHOLD=10
      - CHECK_INTERVAL=60

  location_consumer:
    build: .
    command: python -m app.services.tracking.location_consumer
    depends_on:
      - kafka
      - redis
    environment:
      - KAFKA_URL=kafka:29092
      - REDIS_URL=redis://redis:6379/0

  booking_consumer:
    build: .
    command: python -m app.services.booking.booking_consumer
    depends_on:
      - kafka
      - redis
    environment:
      - KAFKA_URL=kafka:29092
      - REDIS_URL=redis://redis:6379/0

  demand_consumer:
    build: .
    command: python -m app.services.demand.demand_consumer
    depends_on:
      - kafka
      - redis
    environment:
      - KAFKA_URL=kafka:29092
      - REDIS_URL=redis://redis:6379/0

volumes:
  postgres_data:
